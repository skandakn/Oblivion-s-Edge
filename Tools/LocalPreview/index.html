<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OBLIVION'S EDGE — Local Preview</title><style>
:root{color-scheme:dark}*{box-sizing:border-box}body{margin:0;overflow:hidden;background:#050711;color:#e7eaff;font:12px ui-monospace,Consolas,monospace}canvas{width:100vw;height:100vh;display:block;cursor:crosshair}.hud{position:fixed;inset:0;padding:16px;display:flex;justify-content:space-between;pointer-events:none}.side{width:min(320px,34vw)}.box{margin-bottom:8px;padding:9px;background:#080c20df;border:1px solid #535db5}.head{color:#b3bbff;font-weight:bold;letter-spacing:.12em}.r{display:flex;justify-content:space-between;margin-top:6px}.bar{height:6px;background:#151a36;margin:4px 0}.fill{height:100%;background:linear-gradient(90deg,#58ddff,#b7f5ff)}.red{background:linear-gradient(90deg,#e54469,#ffadba)}.purple{background:linear-gradient(90deg,#697dff,#c6ceff)}#msg{position:fixed;bottom:25px;left:50%;transform:translateX(-50%);padding:9px 14px;background:#080c20df;border:1px solid #535db5;text-align:center}#menu{position:fixed;inset:0;display:grid;place-items:center;background:#050713df}.card{max-width:600px;margin:20px;padding:28px;text-align:center;background:#0a0e24;border:1px solid #6875d9}.card h1{letter-spacing:.16em;color:#c2c9ff}.card button{background:#29337d;color:#fff;border:1px solid #b0b8ff;padding:12px 24px;font:inherit;cursor:pointer}@media(max-width:600px){.hud{padding:7px}.side{width:48vw}.box{padding:6px}}
</style></head><body><canvas id="game"></canvas><div class="hud"><div class="side"><div class="box head">SURVIVOR TELEMETRY</div><div class="box" id="player"></div><div class="box" id="weapon"></div></div><div class="side"><div class="box"><b class="head">BIO-SYNTHETIC ARCHON </b><span id="phase"></span><div class="r"><span>BIO-ARMOR</span><span id="armor"></span></div><div class="bar"><div class="fill purple" id="ab"></div></div><div class="r"><span>CORE HEALTH</span><span id="health"></span></div><div class="bar"><div class="fill red" id="hb"></div></div></div><div class="box"><b class="head">OBJECTIVE</b><div id="objective"></div></div></div></div><div id="msg"></div><div id="menu"><div class="card"><h1>OBLIVION'S EDGE</h1><p>Standalone local browser simulation.</p><button id="start">START ENCOUNTER</button><p>WASD move · Mouse aim/fire · Space jump · Shift dash<br>1/2/3 weapons · E interact · R restart</p></div></div>
<script>
(()=>{const c=document.querySelector('#game'),g=c.getContext('2d'),$=s=>document.querySelector(s),K=new Set(),M={x:0,y:0,d:false};let live=false,audio,t0=performance.now(),S;const guns=[['PULSE PISTOL',Infinity,14,.18,720,'#55dfff'],['PLASMA RIFLE',90,28,.12,580,'#bc83ff'],['RAILGUN',12,96,.8,1150,'#fff0a6']];
function size(){c.width=innerWidth;c.height=innerHeight}function reset(){size();S={t:0,p:{x:150,y:innerHeight*.62,z:0,vz:0,h:100,st:100,o:100,sa:100,dash:0,inv:0},w:0,next:0,shots:[],parts:[{n:'DEATHSTORM EDGE',x:260,y:innerHeight*.72,got:false},{n:'DEATHSTORM HANDLE',x:innerWidth*.7,y:innerHeight*.72,got:false}],core:false,coreGot:false,craft:0,done:false,b:{x:innerWidth*.72,y:innerHeight*.39,a:400,h:1000,mode:'AWAKENING',timer:2,cd:1.3,tx:0,ty:0,dead:false},note:'Wake the Archon. Collect the Edge and Handle, then breach its armor.'}}function sound(f=200){try{audio??=new AudioContext();let o=audio.createOscillator(),v=audio.createGain();o.frequency.value=f;v.gain.setValueAtTime(.04,audio.currentTime);v.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.09);o.connect(v).connect(audio.destination);o.start();o.stop(audio.currentTime+.09)}catch{}}
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}function interact(){for(const q of S.parts)if(!q.got&&dist(S.p,q)<65){q.got=true;S.note=q.n+' secured.';sound(540);return}if(S.core&&!S.coreGot){S.coreGot=true;S.craft=60;S.note='ARCHON CORE extracted. DeathStorm crafting has started: 60 seconds.';sound(680);return}if(S.done&&dist(S.p,S.b)<105){S.b.dead=true;S.b.mode='DEFEATED';S.note='DEATHSTORM weak-point strike confirmed. Victory.'}}
addEventListener('resize',size);addEventListener('mousemove',e=>{M.x=e.clientX;M.y=e.clientY});addEventListener('mousedown',()=>M.d=true);addEventListener('mouseup',()=>M.d=false);addEventListener('keydown',e=>{K.add(e.key.toLowerCase());if(e.key===' ')e.preventDefault();if(e.key>='1'&&e.key<='3')S.w=+e.key-1;if(e.key===' '&&S.p.z===0)S.p.vz=450;if(e.key==='Shift'&&S.p.st>25){S.p.dash=.2;S.p.st-=25}if(e.key.toLowerCase()==='e')interact();if(e.key.toLowerCase()==='r')reset()});addEventListener('keyup',e=>K.delete(e.key.toLowerCase()));
function fire(){let w=guns[S.w],p=S.p;if(S.t<S.next||!w[1])return;S.next=S.t+w[3];if(w[1]!==Infinity)w[1]--;let z=Math.atan2(M.y-p.y,M.x-p.x);S.shots.push({x:p.x,y:p.y,vx:Math.cos(z)*w[4],vy:Math.sin(z)*w[4],d:w[2],l:1,col:w[5]});sound(S.w===2?70:220)}function hurt(n){if(S.p.inv||S.b.dead)return;S.p.h=Math.max(0,S.p.h-n);S.p.inv=.35;S.p.sa=Math.max(0,S.p.sa-n*.3);if(!S.p.h)S.note='SIGNAL LOST. Press R to restart.'}
function ai(dt){let b=S.b,p=S.p;if(b.dead)return;b.timer-=dt;let dx=p.x-b.x,dy=p.y-b.y,d=Math.hypot(dx,dy)||1;if(b.mode==='AWAKENING'&&b.timer<=0){b.mode='HUNT';S.note='ARCHON HUNT: keep moving and damage the armor.'}else if(b.mode==='HUNT'){b.x+=dx/d*70*dt;b.y+=dy/d*55*dt;b.cd-=dt;if(b.cd<=0){b.mode='TELEGRAPH';b.timer=.8;b.tx=p.x;b.ty=p.y;S.note='WARNING: charge vector locked. Dash aside.';sound(100)}}else if(b.mode==='TELEGRAPH'&&b.timer<=0){b.mode='CHARGE';b.timer=.7}else if(b.mode==='CHARGE'){let qx=b.tx-b.x,qy=b.ty-b.y,qd=Math.hypot(qx,qy)||1;b.x+=qx/qd*760*dt;b.y+=qy/qd*760*dt;if(dist(p,b)<48)hurt(25);if(b.timer<=0){b.mode='RECOVER';b.timer=1;S.note='Charge missed: recovery window open.'}}else if(b.mode==='RECOVER'&&b.timer<=0){b.mode='HUNT';b.cd=1.6}if(dist(p,b)<35&&b.mode==='HUNT')hurt(10*dt)}
function hit(q){let b=S.b,d=q.d*(b.mode==='RECOVER'?1.6:1);if(b.a>0){b.a=Math.max(0,b.a-d);if(!b.a){S.core=true;b.mode='EXPOSED';S.note='Core is exposed. Press E to extract it.';sound(780)}}else if(!S.coreGot)S.note='Core is exposed. Press E to extract it.';else if(S.done){b.h=Math.max(0,b.h-d);if(!b.h){b.dead=true;b.mode='DEFEATED';S.note='Archon destroyed.'}}}
function update(dt){if(!live)return;S.t+=dt;let p=S.p,ix=(K.has('d')?1:0)-(K.has('a')?1:0),iy=(K.has('s')?1:0)-(K.has('w')?1:0),m=Math.hypot(ix,iy)||1,v=p.dash?670:245;p.x=Math.max(25,Math.min(innerWidth-25,p.x+ix/m*v*dt));p.y=Math.max(25,Math.min(innerHeight-25,p.y+iy/m*v*dt));p.dash=Math.max(0,p.dash-dt);p.st=Math.min(100,p.st+18*dt);p.o=Math.max(0,p.o-.15*dt);p.sa=Math.max(0,p.sa-.025*dt);p.inv=Math.max(0,p.inv-dt);p.z=Math.max(0,p.z+p.vz*dt);p.vz-=1150*dt;if(!p.z)p.vz=0;if(M.d)fire();for(let q of S.shots){q.x+=q.vx*dt;q.y+=q.vy*dt;q.l-=dt;if(q.l>0&&dist(q,S.b)<58){hit(q);q.l=0}}S.shots=S.shots.filter(q=>q.l>0);ai(dt);if(S.craft>0){S.craft-=dt;if(S.craft<=0){S.craft=0;S.done=true;S.note='DEATHSTORM COMPLETE. Press E near the Archon for the finishing strike.'}}ui()}
function meter(n,v,cl){return `<div class="r"><span>${n}</span><span>${Math.ceil(v)} / 100</span></div><div class="bar"><div class="fill ${cl||''}" style="width:${v}%"></div></div>`}function ui(){let p=S.p,b=S.b,w=guns[S.w];$('#player').innerHTML=meter('INTEGRITY',p.h,'red')+meter('STAMINA',p.st)+meter('OXYGEN',p.o)+meter('SANITY',p.sa);$('#weapon').innerHTML=`<b class="head">${w[0]}</b><div class="r"><span>AMMUNITION</span><span>${w[1]===Infinity?'∞':w[1]}</span></div>`;$('#phase').textContent='['+b.mode+']';$('#armor').textContent=Math.ceil(b.a)+' / 400';$('#health').textContent=Math.ceil(b.h)+' / 1000';$('#ab').style.width=b.a/4+'%';$('#hb').style.width=b.h/10+'%';$('#objective').innerHTML=`Edge: ${S.parts[0].got?'SECURED':'PENDING'}<br>Handle: ${S.parts[1].got?'SECURED':'PENDING'}<br>Core: ${S.coreGot?'SECURED':S.core?'EXTRACTABLE — press E':'LOCKED'}<br>${S.craft?'Craft timer: '+Math.ceil(S.craft)+'s':S.done?'DeathStorm: READY':'Crafting: pending'}`;$('#msg').textContent=S.note}
function dot(x,y,r,col){g.beginPath();g.arc(x,y,r,0,7);g.fillStyle=col;g.fill()}function draw(){g.fillStyle='#050711';g.fillRect(0,0,innerWidth,innerHeight);g.strokeStyle='#172044';for(let x=0;x<innerWidth;x+=50){g.beginPath();g.moveTo(x,0);g.lineTo(x,innerHeight);g.stroke()}for(const q of S.parts)if(!q.got){dot(q.x,q.y,17,'#6fe7ff');g.fillStyle='#dfe7ff';g.fillText(q.n+' [E]',q.x-50,q.y-30)}let b=S.b;if(S.core&&!S.coreGot){dot(b.x,b.y+55,20,'#ffe084');g.fillStyle='#ffe9af';g.fillText('ARCHON CORE [E]',b.x-50,b.y+90)}if(!b.dead){dot(b.x,b.y,45,b.mode==='TELEGRAPH'?'#ffe480':b.mode==='CHARGE'?'#ff5476':b.a?'#aab8ff':'#e96f9b');g.strokeStyle='#e5e9ff';g.strokeRect(b.x-20,b.y-8,40,14)}for(const q of S.shots)dot(q.x,q.y,4,q.col);let p=S.p;g.save();g.translate(p.x,p.y-p.z);g.rotate(Math.atan2(M.y-p.y,M.x-p.x));g.fillStyle=p.inv?'#fff':'#62e2ff';g.fillRect(-12,-10,32,20);g.restore();g.fillStyle='#8291b7';g.fillRect(p.x-12,p.y+16,24,4)}function frame(t){let dt=Math.min(.035,(t-t0)/1000);t0=t;update(dt);draw();requestAnimationFrame(frame)}$('#start').onclick=()=>{live=true;$('#menu').style.display='none';audio??=new AudioContext();audio.resume()};reset();ui();requestAnimationFrame(frame)})();
</script></body></html>
